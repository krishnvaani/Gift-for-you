<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 Gift For You</title>
    <style>
        /* SIMPLIFIED CSS - Remove all complex styles for now */
        body {
            font-family: Arial, sans-serif;
            background: #f0f8ff;
            margin: 0;
            padding: 20px;
        }
        .hidden {
            display: none;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            background: #ff6b9d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-box">
            <h2 style="text-align: center;">💖 Welcome</h2>
            <input id="loginName" placeholder="Your name" autocomplete="off">
            <select id="loginRole">
                <option value="">Select Role</option>
                <option value="receiver">Receiver 💝</option>
                <option value="admin">Admin ✨</option>
            </select>
            <input id="loginPass" type="password" placeholder="Password">
            <button id="doLogin">Login</button>
            <button id="closeLogin" style="background: #666;">Close</button>
        </div>
    </div>

    <!-- Main App (hidden initially) -->
    <div id="app" class="hidden">
        <h1>💝 Gift App - Logged In</h1>
        <button id="logoutBtn">Logout</button>
    </div>

    <script>
        // SIMPLE WORKING VERSION - All in one file
        
        console.log("Script loaded!"); // Debug
        
        // Default data
        const DEFAULT_DATA = {
            settings: {
                credentials: {
                    adminPass: 'admin123',
                    receiverPass: 'love123'
                }
            }
        };
        
        // Get references to elements
        const loginModal = document.getElementById('loginModal');
        const app = document.getElementById('app');
        const doLoginBtn = document.getElementById('doLogin');
        const closeLoginBtn = document.getElementById('closeLogin');
        const logoutBtn = document.getElementById('logoutBtn');
        
        // Wait for DOM to load
        document.addEventListener('DOMContentLoaded', function() {
            console.log("DOM loaded - setting up event listeners");
            
            // Setup event listeners
            doLoginBtn.addEventListener('click', doLogin);
            closeLoginBtn.addEventListener('click', closeLogin);
            logoutBtn.addEventListener('click', logout);
            
            // Show login modal initially
            loginModal.classList.remove('hidden');
        });
        
        // Login function - SIMPLIFIED
        function doLogin() {
            console.log("Login button clicked!"); // Debug
            
            const name = document.getElementById('loginName').value.trim();
            const role = document.getElementById('loginRole').value;
            const pass = document.getElementById('loginPass').value;
            
            console.log("Name:", name, "Role:", role, "Pass:", pass); // Debug
            
            if (!name || !role) {
                alert('Please enter name and select role');
                return;
            }
            
            let isValid = false;
            if (role === 'admin' && pass === DEFAULT_DATA.settings.credentials.adminPass) {
                isValid = true;
            } else if (role === 'receiver' && pass === DEFAULT_DATA.settings.credentials.receiverPass) {
                isValid = true;
            }
            
            console.log("Is valid?", isValid); // Debug
            
            if (isValid) {
                // Hide login, show app
                loginModal.classList.add('hidden');
                app.classList.remove('hidden');
                alert('Login successful! Welcome ' + name);
            } else {
                alert('Invalid credentials');
            }
        }
        
        function closeLogin() {
            loginModal.classList.add('hidden');
        }
        
        function logout() {
            app.classList.add('hidden');
            loginModal.classList.remove('hidden');
            // Clear form
            document.getElementById('loginName').value = '';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginRole').selectedIndex = 0;
        }
    </script>
</body>
</html>
